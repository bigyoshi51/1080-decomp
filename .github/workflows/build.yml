name: Build & Report

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# decomp.dev ingests a report from every push run that uploads one. Pushing
# dozens of commits a day (parallel agents) flooded it; the project was
# disabled 2026-09/10 (cf. encounter/decomp.dev#58). Build on every push, but
# publish the report artifact at most once per 24 hours.
permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-assembler/linker
        run: sudo apt-get update && sudo apt-get install -y binutils-mips-linux-gnu

      - name: Download prebuilt IDO 7.1 and 5.3
        run: |
          mkdir -p tools/ido-static-recomp/build/7.1/out
          curl -sL https://github.com/decompals/ido-static-recomp/releases/download/v1.2/ido-7.1-recomp-linux.tar.gz \
            | tar xz -C tools/ido-static-recomp/build/7.1/out
          chmod +x tools/ido-static-recomp/build/7.1/out/*
          # IDO 5.3 is needed for the game_libs_ido53_* units (statically-linked
          # libultra originally built with IDO 5.3 -O1; see docs ido53-carve recipe)
          mkdir -p tools/ido-static-recomp/build/5.3/out
          curl -sL https://github.com/decompals/ido-static-recomp/releases/download/v1.2/ido-5.3-recomp-linux.tar.gz \
            | tar xz -C tools/ido-static-recomp/build/5.3/out
          chmod +x tools/ido-static-recomp/build/5.3/out/*

      - name: Build C objects (no baserom required)
        run: make RUN_CC_CHECK=0 -j$(nproc) objects

      - name: Build non_matching C objects (with -DNON_MATCHING for fuzzy scoring)
        run: make RUN_CC_CHECK=0 -j$(nproc) non_matching_objects

      - name: Throttle decomp.dev reports (at most one per 24h)
        id: gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=us_report&per_page=1" --jq '.artifacts[0].created_at // empty')
          now=$(date -u +%s)
          if [ -z "$last" ] || [ $(( now - $(date -u -d "$last" +%s) )) -ge 86400 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Last report: ${last:-none}; publishing this one."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Last report $last is under 24h old; build only, no upload."
          fi

      - name: Generate progress report
        if: github.event_name == 'pull_request' || steps.gate.outputs.publish == 'true'
        run: |
          curl -sL https://github.com/encounter/objdiff/releases/latest/download/objdiff-cli-linux-x86_64 -o objdiff-cli
          chmod +x objdiff-cli
          ./objdiff-cli report generate -p . -o report.json

      - name: Upload progress report
        if: github.event_name == 'pull_request' || steps.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: report.json
